[project]
name = "Zipvoice"
version = "0.0.11"
description = "Linacodec is a highly compressive and rapid audio tokenizer for audio models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cn2an",
  "huggingface-hub",
  "inflect",
  "jieba",
  "lhotse",
  "librosa",
  "linacodec",
  "numpy",
  "onnxruntime==1.20.1",
  "piper-phonemize",
  "pydub",
  "pypinyin",
  "safetensors",
  "setuptools<81",
  "tensorboard",
  "torch>=2.4.0",          # Move to modern Torch for CUDA 12.x support
  "torchaudio>=2.4.0",
  "transformers<=4.57.6",
  "vocos",
]

[project.optional-dependencies]
train = [
  "einops",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "gpu: tests requiring GPU",
    "slow: tests that take longer than a few seconds",
]

[tool.ruff]
line-length = 120

[tool.uv]
find-links = [
  "https://k2-fsa.github.io/icefall/piper_phonemize.html",
  "https://k2-fsa.github.io/k2/cuda.html" # Add this for k2 CUDA wheels
]
[tool.uv.sources]
linacodec = { git = "https://github.com/ysharma3501/LinaCodec.git" }
versa-speech-audio-toolkit = { git = "https://github.com/wavlab-speech/versa.git" }

[tool.uv.build-backend]
module-root = "" # The root module of the project

[tool.uv.extra-build-dependencies]
git = ["torch"]

[dependency-groups]
dev = [
    "fastapi>=0.100.0",
    "gradio>=4.0.0",
    "huggingface-hub>=0.20.0",
    "pedalboard>=0.9.22",
    "pyinstaller>=6.19.0",
    "pyloudnorm>=0.2.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "uvicorn>=0.20.0",
]
test = [
    "fadtk>=1.1.0",
    "jinja2>=3.1.6",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "resemblyzer>=0.1.4",
    "soundfile>=0.13.1",
    "versa-speech-audio-toolkit",
]
