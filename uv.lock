[[package]]
name = "zipvoice"
version = "0.0.11"
source = { editable = "." }
dependencies = [
    { name = "cn2an" },
    { name = "huggingface-hub" },
    { name = "inflect" },
    { name = "jieba" },
    { name = "lhotse" },
    { name = "librosa" },
    { name = "linacodec" },
    { name = "numpy" },
    { name = "onnxruntime" },
    { name = "piper-phonemize" },
    { name = "pydub" },
    { name = "pypinyin" },
    { name = "safetensors" },
    { name = "setuptools" },
    { name = "tensorboard" },
    { name = "torch", version = "2.11.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torch", version = "2.11.0+cu126", source = { registry = "https://download.pytorch.org/whl/cu126" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torchaudio", version = "2.11.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torchaudio", version = "2.11.0+cu126", source = { registry = "https://download.pytorch.org/whl/cu126" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "transformers" },
    { name = "vocos" },
]

[package.optional-dependencies]
train = [
    { name = "einops" },
]

[package.dev-dependencies]
dev = [
    { name = "fastapi" },
    { name = "gradio" },
    { name = "huggingface-hub" },
    { name = "pedalboard" },
    { name = "pyinstaller" },
    { name = "pyloudnorm" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "uvicorn" },
]
test = [
    { name = "fadtk" },
    { name = "jinja2" },
    { name = "pytest" },
    { name = "pytest-timeout" },
    { name = "pytest-xdist" },
    { name = "resemblyzer" },
    { name = "soundfile" },
    { name = "versa-speech-audio-toolkit" },
]

[package.metadata]
requires-dist = [
    { name = "cn2an" },
    { name = "einops", marker = "extra == 'train'" },
    { name = "huggingface-hub" },
    { name = "inflect" },
    { name = "jieba" },
    { name = "lhotse" },
    { name = "librosa" },
    { name = "linacodec", git = "https://github.com/ysharma3501/LinaCodec.git" },
    { name = "numpy" },
    { name = "onnxruntime", specifier = "==1.20.1" },
    { name = "piper-phonemize" },
    { name = "pydub" },
    { name = "pypinyin" },
    { name = "safetensors" },
    { name = "setuptools", specifier = "<81" },
    { name = "tensorboard" },
    { name = "torch", specifier = ">=2.4.0" },
    { name = "torchaudio", specifier = ">=2.4.0" },
    { name = "transformers", specifier = "<=4.57.6" },
    { name = "vocos" },
]
provides-extras = ["train"]

[package.metadata.requires-dev]
dev = [
    { name = "fastapi", specifier = ">=0.100.0" },
    { name = "gradio", specifier = ">=4.0.0" },
    { name = "huggingface-hub", specifier = ">=0.20.0" },
    { name = "pedalboard", specifier = ">=0.9.22" },
    { name = "pyinstaller", specifier = ">=6.19.0" },
    { name = "pyloudnorm", specifier = ">=0.2.0" },
